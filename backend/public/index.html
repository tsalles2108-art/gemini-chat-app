<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 2.5 Flash Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e24;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #chat-container {
            width: 90%;
            max-width: 800px;
            height: 80vh;
            background-color: #2d2d35;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #chat-header {
            background-color: #121214;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        #chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 75%;
            word-wrap: break-word;
            line-height: 1.4;
        }
        .user-message {
            background-color: #009966;
            align-self: flex-end;
        }
        .gemini-message {
            background-color: #3e3e4a;
            align-self: flex-start;
        }
        #file-preview {
            background-color: #121214;
            padding: 8px 20px;
            font-size: 0.85rem;
            color: #66ffbb;
            display: none;
        }
        #input-container {
            display: flex;
            padding: 15px;
            background-color: #121214;
            gap: 10px;
            align-items: center;
        }
        #user-input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #222;
            color: #fff;
            font-size: 1rem;
        }
        #user-input:focus {
            outline: none;
            border-color: #009966;
        }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-send {
            background-color: #009966;
            color: white;
        }
        .btn-file {
            background-color: #444;
            color: white;
        }
    </style>
</head>
<body>

    <div id="chat-container">
        <div id="chat-header">Gemini 2.5 Flash Chat 🚀</div>
        
        <div id="chat-messages">
            <div class="message gemini-message">Olá! Como posso ajudar hoje?</div>
        </div>

        <div id="file-preview"></div>

        <div id="input-container">
            <input type="file" id="file-input" style="display: none;">
            <button class="btn btn-file" onclick="document.getElementById('file-input').click()">📎</button>
            
            <input type="text" id="user-input" placeholder="Digite sua mensagem aqui..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button class="btn btn-send" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        // Mapeamento dos elementos do DOM
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');

        // Função principal para envio de mensagens e uploads
        async function sendMessage() {
            const text = userInput.value.trim();
            const fileInput = document.getElementById('file-input');
            const file = fileInput ? fileInput.files[0] : null;

            if (!text && !file) return;

            let userDisplay = text;
            if (file) {
                userDisplay += `<br><small style="color: #66ffbb;">📁 [Arquivo: ${file.name}]</small>`;
            }

            const userMessageDiv = appendMessage('', 'user-message');
            userMessageDiv.innerHTML = userDisplay;

            userInput.value = '';
            if (fileInput) fileInput.value = '';
            const filePreview = document.getElementById('file-preview');
            if (filePreview) filePreview.style.display = 'none';

            const botMessageDiv = appendMessage('Processando arquivo e pensando...', 'gemini-message');

            const formData = new FormData();
            if (text) formData.append('message', text);
            if (file) formData.append('file', file);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                let formattedResponse = data.response || "Sem resposta do servidor.";
                formattedResponse = formattedResponse
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\n/g, '<br>');

                botMessageDiv.innerHTML = formattedResponse;
            } catch (error) {
                botMessageDiv.innerText = "Erro ao conectar com o servidor.";
                console.error(error);
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Função auxiliar para inserir mensagens no chat
        document.getElementById('file-input')?.addEventListener('change', function() {
            const preview = document.getElementById('file-preview');
            if (preview) {
                if (this.files.length > 0) {
                    preview.innerText = `Arquivo anexado: ${this.files[0].name}`;
                    preview.style.display = 'block';
                } else {
                    preview.style.display = 'none';
                }
            }
        });

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text; 
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return div;
        }
    </script>
</body>
</html>
