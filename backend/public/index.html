<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chat App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #202123; color: #ececf1; display: flex; height: 100vh; }
        .chat-container { display: flex; flex-direction: column; width: 100%; max-width: 800px; margin: 0 auto; background: #343541; height: 100vh; box-shadow: 0 0 10px rgba(0,0,0,0.3); }
        .chat-header { background: #202123; padding: 15px; text-align: center; border-bottom: 1px solid #4d4d4f; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 80%; line-height: 1.5; word-wrap: break-word; }
        .user-message { background: #10a37f; color: white; align-self: flex-end; }
        .gemini-message { background: #444654; color: #ececf1; align-self: flex-start; border: 1px solid #4d4d4f; }
        .chat-input-area { padding: 20px; background: #343541; display: flex; gap: 10px; border-top: 1px solid #4d4d4f; }
        input { flex: 1; padding: 14px; border-radius: 8px; border: 1px solid #4d4d4f; background: #40414f; color: white; font-size: 16px; outline: none; }
        input:focus { border-color: #10a37f; }
        button { background: #10a37f; color: white; border: none; padding: 0 20px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1a7f64; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h2>Gemini 2.5 Flash Chat 🚀</h2>
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="message gemini-message">Olá! Como posso te ajudar hoje?</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Digite sua mensagem aqui..." autocomplete="off">
        <button id="sendBtn">Enviar</button>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // Adiciona mensagem do usuário na tela
        appendMessage(text, 'user-message');
        userInput.value = '';

        // Cria balão de carregamento para o Gemini
        const botMessageDiv = appendMessage('Pensando...', 'gemini-message');

        try {
            // Envia a requisição para a rota interna do seu servidor backend
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });

            const data = await response.json();
            botMessageDiv.innerText = data.response || "Sem resposta do servidor.";
        } catch (error) {
            botMessageDiv.innerText = "Erro ao conectar com o servidor.";
            console.error(error);
        }
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function appendMessage(text, className) {
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerText = text;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return div;
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
</script>

</body>
</html>
